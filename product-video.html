<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Product Video · SDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="assets/js/analytics.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:"JetBrains Mono","PingFang SC","Microsoft YaHei",monospace;background:#f6f7fb;color:#0d0d1a;line-height:1.6}
:root{--green:#9dcb1f;--dark:#0b0b1a;--gray:#6b7280}
.navbar{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 48px;height:68px;display:flex;align-items:center;background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,0.04)}
.navbar a{text-decoration:none;color:var(--dark);font-size:14px;font-weight:500}
.hero{padding:120px 48px 60px;background:linear-gradient(135deg,#003a4a,#0b0b1a);color:#fff}
.hero h1{font-size:clamp(32px,5vw,56px);font-weight:800;margin-bottom:16px}
.hero p{font-size:16px;color:rgba(255,255,255,0.5);max-width:600px;margin-bottom:24px}
.content{padding:80px 48px;max-width:1000px;margin:0 auto}
.content h2{font-size:24px;font-weight:700;margin-bottom:20px}
.content p{color:var(--gray);margin-bottom:16px;font-size:15px;line-height:1.8}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:10px;background:var(--green);color:#fff;font-weight:600;text-decoration:none;transition:all .3s;margin-bottom:40px}
.back-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(157,203,31,0.3)}
.video-wrapper{position:relative;width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.15);margin-bottom:40px;background:#000}
.video-wrapper iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.thumbnail{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;cursor:pointer;transition:opacity .5s;z-index:1}
.thumbnail.hidden{opacity:0;pointer-events:none}
.play-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;width:80px;height:80px;border-radius:50%;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;border:2px solid rgba(255,255,255,0.2)}
.play-overlay:hover{transform:translate(-50%,-50%) scale(1.1);background:var(--green);border-color:var(--green)}
.play-overlay svg{margin-left:4px;width:28px;height:28px;fill:white}
@media(max-width:768px){.hero{padding:100px 24px 40px}.content{padding:40px 24px}}
</style>
</head>
