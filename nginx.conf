server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Serve the site under /design-system/ when an external Nginx preserves
  # that path while proxying to this container.
  location = /design-system {
    return 301 /design-system/;
  }

  location ^~ /design-system/ {
    rewrite ^/design-system/(.*)$ /$1 last;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  # Vite emits content-hashed files here, so they can be cached permanently.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  location ~* \.(json|png|jpg|jpeg|gif|svg|webp|webm|woff2?|ttf|otf|ico|pdf)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  location ~* \.html$ {
    # Always deliver a fresh HTML document. Do not retain validators that
    # would allow clients to reuse a prior document via a 304 response.
    etag off;
    if_modified_since off;
    expires -1;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Pragma "no-cache" always;
  }
}
