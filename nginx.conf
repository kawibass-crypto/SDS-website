server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Serve the site under /design-system/ when an external Nginx preserves
  # that path while proxying to this container.
  location = /design-system {
    return 301 /design-system/;
  }

  location ^~ /design-system/ {
    rewrite ^/design-system/(.*)$ /$1 break;
    try_files $uri $uri/ =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(css|js|json|png|jpg|jpeg|gif|svg|webp|webm|woff2?|ttf|otf|ico|pdf)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }
}
